    regions: [NTSC-U]
    trust: unverified
    ships_nz: unknown
  - name: Cap'n Games
    tier: C
    regions: [NTSC-U]
    trust: unverified
    ships_nz: unknown
  - name: Fair Game
    tier: C
    regions: [NTSC-U]
    trust: unverified
    ships_nz: unknown

# ---------------------------------------------------------------------------
tier_d_marketplaces:
  - name: eBay AU
    url: https://www.ebay.com.au/
    tier: D
    regions: [PAL]
    gst: charged
    ships_nz: direct
    trust: low
    notes: >
      AU sellers often post to NZ directly and cheaply, dodging eIS entirely.
      Best marketplace for PAL stock. Seller feedback is the only authenticity
      signal — weight it heavily.

  - name: eBay US/UK
    url: https://www.ebay.com/
    tier: D
    regions: [NTSC-U, PAL]
    gst: charged
    ships_nz: direct
    trust: low
    notes: >
      eBay International Shipping (eIS) is convenient but widely criticised as
      expensive — one seller reported their own $5 postage became ~$20 for the
      buyer via the hub. NZ reports are mixed (a Geekzone user paid ~NZ$32 for
      a >5kg item, less than half other quotes). ALWAYS compare eIS against
      seller-direct post, and against forwarding to a US address.

  - name: Yahoo Auctions JP
    url: https://auctions.yahoo.co.jp/
    tier: D
    regions: [NTSC-J]
    gst: none
    ships_nz: forward
    proxy_required: true
    trust: medium
    notes: >
      Deepest retro pool on earth. Auction close times are brutal from NZ —
      automated sniping (Buyee) matters. Repro rate on JP-domestic stock is
      structurally lower than Western markets.

  - name: Mercari JP
    url: https://jp.mercari.com/
    tier: D
    regions: [NTSC-J]
    gst: none
    ships_nz: forward
    proxy_required: true
    trust: medium
    notes: >
      Use mercari.jp (domestic), NOT mercari.com — the selection is far deeper.
      Buyee has a native "Buy with Buyee" flow here.

  - name: Suruga-ya
    url: https://www.suruga-ya.jp/
    tier: D
    regions: [NTSC-J]
    gst: none
    ships_nz: forward
    proxy_required: true
    trust: medium
    notes: Japanese second-hand chain. Deep retro catalogue.

# ---------------------------------------------------------------------------
plumbing:
  japan_proxies:
    # Fee STRUCTURE is durable. Exact yen figures are NOT — sources actively
    # contradict each other (ZenMarket quoted at both Y300 and Y500/item;
    # Neokyo at Y250, Y300 AND Y350, all within 2026 sources).
    # ALWAYS confirm live rates before a large order.
    - name: ZenMarket
      model: flat ~Y300/item
      consolidation: free
      storage_days: 45-60
      best_for: Multi-item hauls; mid-to-high value. Flat fee wins as price rises.
    - name: Buyee
      model: ~5-6% + flat
      consolidation: ~Y500
      best_for: >
        Yahoo Auctions sniping (auto-bid). Official Mercari/Yahoo/Rakuma
        partnerships. Percentage overtakes ZenMarket's flat fee around
        Y5,000-6,000/item. Does NOT support Amazon JP.
    - name: FROM JAPAN
      model: flat ~Y250 + 5% consolidation
      best_for: Amazon JP; mid-high value single items.
    - name: Sendico
      storage_days: 90
      best_for: Longest storage — slow-building hauls.
    - name: Neokyo
      model: flat (~Y250-350, disputed)
      best_for: EU-optimised rates — LESS RELEVANT FOR NZ. Manual auction bidding = slow.

  forwarders:
    - name: NZ Post You Shop
      url: https://www.nzpost.co.nz/tools/you-shop
      addresses: [US, UK]
      warning: >
        NZ$55 incl GST per parcel tariff classification fee on parcels valued
        NZ$400-1000. THIS IS THE $400 CEILING. Also aggregates multiple <$400
        parcels sent simultaneously to the same address — deliberate splitting
        can backfire.
      volumetric: L*W*H / 5000
    - name: Stackry
      url: https://www.stackry.com/
      addresses: [US]
      notes: >
        Warehouse in a tax-free US state — saves ~7.5% US sales tax, which
        STACKS with the GST saving from Rule 1. Consolidation, de-boxing to cut
        volumetric weight, 45 days free storage. Claims up to 80% freight saving.
        DE-BOXING WARNING: fine for loose carts, destroys value on CIB.
    - name: Forward2Me
      addresses: [UK]
      trust: unverified
      notes: Relevant once the UK (PAL) pass is done.

# ---------------------------------------------------------------------------
pricecharting:
  # API REJECTED: paywalled at US$49/mo (~NZ$1,000/yr) to save ~40 min/yr of typing.
  # market_usd is cached in the wantlist sheet, refreshed by hand quarterly.
  # Do NOT scrape product pages on a schedule — that's what the paid tier sells.
  base_url: https://www.pricecharting.com
  refresh_cadence_days: 90
  stale_warning_days: 120
  currency: USD

  # Which price to read off the page for each condition value
  condition_to_price_label:
    loose: Loose Price
    cib: Complete Price
    box_only: Box Only Price
    sealed: New Price
    boxed: Item & Box          # web page only; shown in the full price guide table

  # PriceCharting console IDs — useful for building refresh URLs
  console_ids:
    PAL GameBoy: G73
    PAL GameBoy Color: G77
    PAL GameBoy Advance: G80
    PAL Nintendo DS: G78
    PAL Nintendo 3DS: G94
    JP GameBoy: G112
    Super Nintendo: G13
    PAL Super Nintendo: G61
    PAL Sega Mega Drive: G71
    JP Sega Mega Drive: G105
    PAL Sega Saturn: G97
    JP Sega Saturn: G67

  # FETCH NOTE (verified 2026-07-17): PriceCharting 403s plain/datacenter
  # fetchers — use the Firecrawl scrape tool, which renders the page fine.
  # https://www.pricecharting.com/game/{pc_id} redirects to the canonical slug
  # URL. A redirect to /search-products means the URL/ID is WRONG — treat as
  # errored; never read Low/Mid/High prices off a search page.

  # Known product IDs — all 22 wantlist rows, resolved live 2026-07-17.
  # Prices below are the value for the row's WANTED condition (cib → Complete,
  # box_only → Box Only), snapshot only — always confirm live at Tier 2.
  # DS rows (region ANY) are cached against the US "Nintendo DS" product —
  # match the listing's actual region to the right product when confirming.
  known_ids:
    pk-red: 46793        # Pokemon Red, PAL GameBoy — CIB US$206.20
