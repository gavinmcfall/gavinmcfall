# Retro Scout — source list
# Companion to retro-game-sourcing-nz.md (read that for the WHY behind the tiering)
# Refresh: quarterly. Shops close; fees change.
#
# tier      A = NZ domestic, B = Australia, C = US, D = marketplaces
#           Search order is A -> B -> D -> C. Tier B outranks C because AU is PAL.
# regions   What region stock this source sells. Match against wantlist.region.
# gst       charged   = >NZ$60k/yr NZ sales, adds 15% at checkout
#           none      = under the threshold, legitimately GST-free under NZ$1000
#           unknown   = assume charged when estimating (conservative)
# ships_nz  direct | forward | no | unknown
# trust     Repro/authenticity confidence. Drives priority-1 ranking.
#           high | medium | low | unverified

meta:
  version: 1
  compiled: 2026-07-16
  currency_note: >
    All thresholds in the wantlist are NZD LANDED. Sources price in their own
    currency. Always convert live — never from memory.

# ---------------------------------------------------------------------------
tier_a_nz:
  - name: Mad Elf Games
    url: https://madelfgames.co.nz/
    tier: A
    regions: [PAL]
    gst: n/a-domestic
    ships_nz: direct
    trust: medium
    notes: >
      Auckland, family-run, collector-friendly. Free AKL shipping >$50,
      NZ-wide >$99. Local to Karaka — possible pickup.

  - name: Memory Lane Games
    url: https://memorylanegames.co.nz/
    tier: A
    regions: [PAL]
    gst: n/a-domestic
    ships_nz: direct
    trust: medium
    notes: Free shipping >$159. Has a make-an-offer flow — worth using on grails.

  - name: Respect Retro Gaming
    url: https://www.respectretrogaming.co.nz/
    tier: A
    regions: [PAL]
    gst: n/a-domestic
    ships_nz: direct
    trust: medium
    notes: Buy/sell/trade. Also anime, guides, boxed items.

  - name: TradeMe
    url: https://www.trademe.co.nz/
    tier: A
    regions: [PAL, NTSC-J, NTSC-U]
    gst: n/a-domestic
    ships_nz: direct
    trust: low
    notes: >
      Deepest NZ second-hand pool, but private sellers = highest repro risk in
      Tier A. Never auto-recommend a TradeMe hit above priority=medium without
      a clear photo of the cart label and PCB.

  - name: Mighty Ape
    url: https://www.mightyape.co.nz/games/retro-legacy-gaming/all
    tier: A
    regions: [PAL]
    gst: n/a-domestic
    ships_nz: direct
    trust: medium
    notes: Mainstream pricing. Thin retro range.

  - name: Techexpress
    url: https://www.techexpress.co.nz/collections/gaming
    tier: A
    regions: [PAL]
    gst: n/a-domestic
    ships_nz: direct
    trust: high
    games: false
    notes: >
      NOT a games source — parts, tools, accessories, repair. All stock in NZ,
      explicitly no drop-shipping. Best NZ source for restoration bits.
      Exclude from wantlist searches; keep for hardware.

  - name: NZGameShop
    url: https://nzgameshop.com/retro-gaming
    tier: A
    regions: [PAL]
    gst: n/a-domestic
    ships_nz: direct
    trust: medium
    notes: ~$1.99 delivery. Very thin retro range (~156 items).

# ---------------------------------------------------------------------------
# Tier B is the primary hunting ground. AU is PAL = plugs into stock NZ kit.
tier_b_au:
  - name: Retro Sales
    url: https://retrosales.com.au/
    tier: B
    regions: [PAL, NTSC-J]
    gst: unknown
    ships_nz: direct
    trust: high
    primary: true
    grading: [Good, Very Good, Excellent]
    notes: >
      TOP PICK. Melbourne, ~15,000 items. Ships worldwide via Australia Post,
      7-16 days. Free shipping over $100. Grades every game Good/Very Good/
      Excellent with published definitions — the only source here with a
      machine-readable condition signal. Also runs a console repair shop
      (PixelFX-endorsed) and sells spare parts/PSUs. Can special-order from
      Japanese distributors on request — an English-speaking route into JP
      stock without proxy plumbing.

  - name: Fully Retro
    url: https://www.fullyretro.com/
    tier: B
    regions: [PAL]
    gst: unknown
    ships_nz: direct
    trust: high
    notes: >
      FREE shipping to NZ (some large consoles now carry freight). Explicit
      anti-piracy / 100% authentic stance. States games are compatible with
      Australian systems = NZ systems. Positioned as premium — Retro Sales
      runs a landing page targeting their pricing. Free freight can still win
      on a single cart. Always price-check against Retro Sales.

  - name: Retro Unit
    url: https://retrounit.com.au/
    tier: B
    regions: [PAL]
    gst: unknown
    ships_nz: direct
    trust: medium
    notes: Ships worldwide, 30-day guarantee. Games are only part of a wider catalogue.

  - name: The Gamesmen
    url: https://www.gamesmen.com.au/retro
    tier: B
    regions: [PAL]
    gst: unknown
    ships_nz: unknown
    trust: high
    notes: >
      Sydney, founded 1982, first AU retailer online (1996). In-store Retro
      Video Game Museum. Deep institutional legitimacy = very low repro risk.
      ACTION: confirm NZ shipping by email.

  - name: Super Retro
    url: https://superretro.com.au/
    tier: B
    regions: [PAL, NTSC-J]
    gst: unknown
    ships_nz: unknown
    trust: medium
    notes: >
      Physical store + online. Has an International Games & Consoles category
      (JP stock held locally = no proxy needed). Does repairs.
      ACTION: confirm NZ shipping.

  - name: Sydney Retro
    url: https://sydneyretro.com.au/
    tier: B
    regions: [PAL, NTSC-J]
    gst: none
    ships_nz: forward
    trust: medium
    notes: >
      AU-only shipping (stated). One-person operation, cleans and tests
      everything. Stocks JP imports. Small enough to be certainly GST-free.
      ACTION: email — a solo operator will likely post to NZ if asked.

  - name: The Game Experts
    url: https://thegameexperts.com.au/
    tier: B
    regions: [PAL]
    gst: unknown
    ships_nz: unknown
    trust: unverified
    notes: Thin information available. Verify before trusting.

