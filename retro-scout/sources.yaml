      PA, since 2003. Heavy authenticity marketing, staff technician, 1-year
      warranty. BUT widely regarded as expensive — a rival eBay store's blurb
      literally reads "My prices are cheaper than DKOldies!". Long-standing
      collector criticism re: aftermarket parts in "refurbished" consoles —
      UNVERIFIED, treat as a flag not a verdict. Always price-check vs Lukie.

  - name: eStarland
    url: https://www.estarland.com/
    tier: C
    regions: [NTSC-U]
    gst: none
    ships_nz: unknown
    trust: medium
    notes: VA. Long-running. Verify NZ shipping.

