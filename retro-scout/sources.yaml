    url: https://www.lukiegames.com/
    tier: C
    regions: [NTSC-U]
    gst: none
    ships_nz: direct
    trust: high
    notes: >
      FL. Huge selection incl. obscure systems (NeoGeo, Vectrex, Jaguar,
      ColecoVision). Tests every game, 90-day returns. Generally better value
      than DKOldies. Preferred US default.

  - name: DKOldies
    url: https://www.dkoldies.com/
    tier: C
    regions: [NTSC-U]
    gst: none
    ships_nz: direct
    trust: medium
