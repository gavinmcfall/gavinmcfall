# Hard-coded border rules. See retro-game-sourcing-nz.md sections Rule 1-3.
border_rules:
  gst_rate: 0.15
  gst_registration_threshold_nzd: 60000   # seller's annual NZ sales
  lvg_levy_nzd_air: 2.21                  # + GST, per consignment, from 2026-04-01
  lvg_levy_nzd_sea: 2.09                  # + GST
  youshop_tariff_classification_nzd: 55   # incl GST, on parcels NZ$400-1000
  youshop_fee_band_nzd: [400, 1000]
  high_value_threshold_nzd: 1000
  high_value_levy_nzd_air: 51.81          # + GST + duty, on top
  target_parcel_ceiling_nzd: 400          # THE operating number
